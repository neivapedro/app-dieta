# O Supabase gratuito pausa o projeto depois de 7 dias sem uso. Este agendamento
# faz uma consulta leve a cada 3 dias para mantê-lo acordado. Se o projeto já
# estiver pausado, a execução falha e o GitHub avisa por e-mail: aí é só entrar
# no painel do Supabase e tocar em "Restore project".
name: Manter Supabase acordado

on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  # Para reativar este próprio agendamento (o GitHub desliga agendamentos após 60 dias sem commits)
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manter este agendamento ativo
        run: |
          curl -s -o /dev/null -w "reativar agendamento: %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/manter-supabase.yml/enable"
      - name: Consulta leve no banco
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" src/config.ts | head -1)
          CHAVE=$(grep -o "sb_publishable_[A-Za-z0-9_]*" src/config.ts | head -1)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" \
            "$URL/rest/v1/perfis?select=user_id&limit=1")
          echo "Supabase respondeu $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::O Supabase não respondeu (pode estar pausado). Abra https://supabase.com/dashboard e restaure o projeto."
            exit 1
          fi
